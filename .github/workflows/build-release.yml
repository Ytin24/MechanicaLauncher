name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Set version
        id: version
        run: |
          if ($env:GITHUB_REF -match 'refs/tags/v(.+)') {
            $ver = $matches[1]
          } else {
            $ver = "0.0.0"
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore -p:Platform=x64

      - name: Publish
        run: |
          dotnet publish src/MechanicaLauncher/MechanicaLauncher.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=None `
            -p:PublishTrimmed=false `
            -r win-x64 `
            --output ./publish

      - name: Download WindowsAppRuntime
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/1.7/latest/windowsappruntimeinstall-x64.exe" -OutFile ./publish/WindowsAppRuntimeInstall.exe

      - name: Build Installer
        run: |
          $version = if ($env:GITHUB_REF -match 'refs/tags/v(.+)') { $matches[1] } else { "dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$version installer\setup.iss

      - name: Zip portable
        run: Compress-Archive -Path ./publish/* -DestinationPath MechanicaLauncher-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MechanicaLauncher-x64
          path: |
            MechanicaLauncher-x64-portable.zip
            output/MechanicaLauncher-*-setup.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MechanicaLauncher-x64/MechanicaLauncher-x64-portable.zip
            artifacts/MechanicaLauncher-x64/output/MechanicaLauncher-*-setup.exe
