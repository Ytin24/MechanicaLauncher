name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore -p:Platform=x64

      - name: Build
        run: dotnet build -c Release -p:Platform=x64 --no-restore

      - name: Publish
        run: |
          dotnet publish src/MechanicaLauncher/MechanicaLauncher.csproj `
            -c Release `
            -p:Platform=x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishTrimmed=false `
            -r win-x64 `
            --output ./publish

      - name: Zip artifacts
        run: Compress-Archive -Path ./publish/* -DestinationPath MechanicaLauncher-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MechanicaLauncher-x64
          path: MechanicaLauncher-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/MechanicaLauncher-x64/MechanicaLauncher-x64.zip
