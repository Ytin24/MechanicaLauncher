name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Publish
        run: |
          dotnet publish src/MechanicaLauncher/MechanicaLauncher.csproj `
            -c Release `
            -p:Platform=${{ matrix.platform }} `
            -p:PublishSingleFile=true `
            -p:SelfContained=true `
            -p:PublishTrimmed=false `
            --output ./publish/${{ matrix.platform }}

      - name: Zip artifacts
        run: Compress-Archive -Path ./publish/${{ matrix.platform }}/* -DestinationPath MechanicaLauncher-${{ matrix.platform }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MechanicaLauncher-${{ matrix.platform }}
          path: MechanicaLauncher-${{ matrix.platform }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/MechanicaLauncher-x64/MechanicaLauncher-x64.zip
            artifacts/MechanicaLauncher-arm64/MechanicaLauncher-arm64.zip
